[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-rest-replication"
version = "0.1.0"
description = "Application-level database replication for Django over REST. Supports hub-and-spoke and peer-to-peer topologies, multi-tenancy, per-table/per-field policies, and sync/async delivery."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jenard Kin Cabia", email = "nardjay1997@gmail.com" }]
keywords = [
    "django",
    "replication",
    "database",
    "sync",
    "rest",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "django-model-utils>=5.0",
    "httpx>=0.28",
    "uuid-utils>=0.9",
]

[project.optional-dependencies]
celery = ["celery>=5.4"]
django-q = ["django-q2>=1.7"]
filter = ["django-filter>=24.0"]
schema = ["drf-spectacular>=0.28"]

[project.urls]
Homepage = "https://github.com/JenardKin/django-rest-replication"
Repository = "https://github.com/JenardKin/django-rest-replication"
Issues = "https://github.com/JenardKin/django-rest-replication/issues"
Changelog = "https://github.com/JenardKin/django-rest-replication/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.35",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "drf-spectacular>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_replication"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "CHANGELOG.md", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # do not perform function calls in default args (DRF does this)
]

[tool.ruff.lint.isort]
known-first-party = ["django_replication"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "model_utils.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.testapp.settings"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
    "slow: marks tests as slow (deselect with '-m not slow')",
    "hub_spoke: hub-and-spoke topology tests",
    "p2p: peer-to-peer topology tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/django_replication"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
